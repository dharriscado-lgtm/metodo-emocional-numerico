name: Generar APK Android

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto Android
        run: |
          rm -rf android-build
          mkdir android-build
      - name: Comprobar archivos
        run: |
          pwd
          ls -lah
          test -f MetodoEmocionalNumerico_Android_V88_AZUL.zip
          
      - name: Descomprimir proyecto
        run: |   
          unzip -q MetodoEmocionalNumerico_Android_V88_AZUL.zip -d android-build
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Generar AAB
        working-directory: android-build
        run: gradle bundleRelease

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: metodo-emocional-numerico-aab
          path: android-build/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          
