name: Generar APK Android

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto Android
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q MetodoEmocionalNumerico_Android_Project_V83.zip -d android-build

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Generar APK
        working-directory: android-build
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: metodo-emocional-numerico-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
